packages:
  - "engine/**"
  - "cli/**"
  - "app/**"
  - "website/**"
minimumReleaseAge: 10080
minimumReleaseAgeStrict: false
minimumReleaseAgeIgnoreMissingTime: true
blockExoticSubdeps: true
strictDepBuilds: true
savePrefix: ""
overrides:
  rollup@<2.80.0: 2.80.0
  ws@>=8.0.0 <8.20.1: 8.20.1
  uuid@<11.1.1: 11.1.1
allowBuilds:
  '@google/genai': true
  '@swc/core': true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true
