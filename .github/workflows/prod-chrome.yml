name: Deploy Chrome Extension on Prod Push

on:
  push:
    paths:
      - "app/manifest.json"
      - "app/vite.config.crx.ts"
      - ".github/workflows/prod-chrome.yml"
    branches:
      - main

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build Chrome Extension
        run: pnpm build:crx
        working-directory: app
        env:
          VITE_HISSAB_WEBSITE_URL: ${{ secrets.HISSAB_WEBSITE_URL }}
          VITE_HISSAB_SERVER_URL: ${{ secrets.HISSAB_SERVER_URL }}
          VITE_POLAR_CHECKOUT_URL: ${{ secrets.POLAR_CHECKOUT_URL }}
          VITE_POLAR_PORTAL_URL: ${{ secrets.POLAR_PORTAL_URL }}

      - name: Zip Chrome Extension
        run: zip -r hissab-chrome-extension.zip dist
        working-directory: app

      - name: Upload and Publish Extension
        working-directory: app
        run: |-
          pnpm chrome-webstore-upload upload \
            --source hissab-chrome-extension.zip \
            --extension-id ${{ env.EXTENSION_ID }} \
            --client-id ${{ secrets.CI_GOOGLE_CLIENT_ID }} \
            --client-secret ${{ secrets.CI_GOOGLE_CLIENT_SECRET }} \
            --refresh-token ${{ secrets.CI_GOOGLE_REFRESH_TOKEN }}
        env:
          EXTENSION_ID: ${{ secrets.HISSAB_CHROME_EXTENSION_ID }}
          CI_GOOGLE_CLIENT_ID: ${{ secrets.CI_GOOGLE_CLIENT_ID }}
          CI_GOOGLE_CLIENT_SECRET: ${{ secrets.CI_GOOGLE_CLIENT_SECRET }}
          CI_GOOGLE_REFRESH_TOKEN: ${{ secrets.CI_GOOGLE_REFRESH_TOKEN }}
