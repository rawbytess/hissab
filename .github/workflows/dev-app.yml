name: Deploy App on Dev Push

on:
  push:
    paths:
      - "app/**"
      - "lib/**"
      - "engine/**"
      - ".github/workflows/dev-app.yml"
    branches-ignore:
      - main

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build App
        run: pnpm build:pwa
        working-directory: app
        env:
          VITE_HISSAB_WEBSITE_URL: ${{ secrets.HISSAB_WEBSITE_URL }}
          VITE_HISSAB_SERVER_URL: ${{ secrets.HISSAB_SERVER_URL }}
          VITE_POLAR_CHECKOUT_URL: ${{ secrets.POLAR_CHECKOUT_URL }}
          VITE_POLAR_PORTAL_URL: ${{ secrets.POLAR_PORTAL_URL }}

      - name: Deploy APP
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: app
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          environment: dev
          command: deploy --env dev --no-bundle
        env:
          VITE_HISSAB_WEBSITE_URL: ${{ secrets.HISSAB_WEBSITE_URL }}
          VITE_HISSAB_SERVER_URL: ${{ secrets.HISSAB_SERVER_URL }}
          VITE_POLAR_CHECKOUT_URL: ${{ secrets.POLAR_CHECKOUT_URL }}
          VITE_POLAR_PORTAL_URL: ${{ secrets.POLAR_PORTAL_URL }}
