<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hissab store screenshot: Math the way you’d say it</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        --copy-x: 80px;
        --copy-w: 416px;
        --h1-size: 55px;
      }

      .copy .lockup {
        --mark: 40px;
        margin-bottom: 36px;
      }

      /* ====== Chrome window (dark theme), cropped by the canvas bottom ====== */
      .browser {
        --pw: 720px;
        --ph: 780px;
        position: absolute;
        left: 520px;
        top: 64px;
        width: var(--pw);
        height: var(--ph);
      }

      .window {
        position: relative;
        height: 100%;
        overflow: hidden;
        border-radius: 12px 12px 0 0;
        background: #f6f4f8;
        outline: 1px solid rgba(255, 255, 255, 0.08);
        outline-offset: -1px;
        box-shadow:
          0 2px 4px rgba(var(--plum), 0.14),
          0 30px 70px -20px rgba(var(--plum), 0.55);
      }

      .tabstrip {
        display: flex;
        align-items: flex-end;
        height: 40px;
        padding: 0 8px 0 14px;
        background: var(--chrome-frame);
      }

      .lights {
        display: flex;
        gap: 8px;
        align-self: center;
        margin-right: 18px;
      }

      .lights i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ff5f57;
      }
      .lights i:nth-child(2) {
        background: #febc2e;
      }
      .lights i:nth-child(3) {
        background: #28c840;
      }

      .tab {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 232px;
        height: 34px;
        padding: 0 12px;
        border-radius: 10px 10px 0 0;
        background: var(--chrome-tab);
        color: var(--chrome-text);
        font-size: 12.5px;
      }

      .tab .favicon {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        background: linear-gradient(135deg, #7cc4a4, #3e8f73);
      }

      .tab .close {
        margin-left: auto;
        color: var(--chrome-text-dim);
      }

      .newtab {
        align-self: center;
        margin-left: 10px;
        color: var(--chrome-icon);
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 44px;
        padding: 0 10px;
        background: var(--chrome-tab);
        border-bottom: 1px solid #2a2a2e;
      }

      .toolbar .btn {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        color: var(--chrome-icon);
        flex: none;
      }

      .toolbar .btn.dim {
        color: #6c6c72;
      }

      .toolbar .btn.active {
        background: rgba(255, 255, 255, 0.12);
      }

      .toolbar .btn img {
        width: 18px;
        height: 18px;
        border-radius: 4px;
      }

      .omnibox {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        height: 32px;
        margin: 0 8px 0 6px;
        padding: 0 10px 0 12px;
        border-radius: 16px;
        background: var(--chrome-omnibox);
        color: var(--chrome-text);
        font-size: 13.5px;
      }

      .omnibox .host {
        color: var(--chrome-text);
      }

      .omnibox .path {
        color: var(--chrome-text-dim);
      }

      .omnibox svg:last-child {
        margin-left: auto;
        color: var(--chrome-icon);
      }

      .avatar {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #6b8fd6;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
      }

      /* ====== The page behind the popup: deliberately generic ====== */
      .page {
        padding: 28px 36px;
      }

      .page .bar {
        height: 12px;
        margin-bottom: 12px;
        border-radius: 6px;
        background: #e4e0ea;
      }

      .page .title {
        height: 26px;
        width: 64%;
        margin: 22px 0 18px;
        border-radius: 8px;
        background: #d6d0de;
      }

      .page .hero {
        height: 200px;
        margin-bottom: 22px;
        border-radius: 12px;
        background: linear-gradient(160deg, #d9e8f5, #eadff3 60%, #f4e3dc);
      }

      /* The popup hangs from the Hissab toolbar button, right edges aligned. */
      .browser .popup {
        --x: 122px;
        --y: 86px;
      }
    </style>
  </head>
  <body style="--w: 1280px; --h: 800px">
    <div class="copy">
      <div class="lockup">
        <img src="assets/icon.png" alt="" />
        <span>Hissab</span>
      </div>
      <h1>Math the way you’d say it</h1>
      <p>
        Type everyday calculations into a popup in your toolbar. Answers line
        up on the right as you type, and your work stays on your device.
      </p>
    </div>

    <div class="browser long-shadow">
      <div class="window">
        <div class="tabstrip">
          <div class="lights"><i></i><i></i><i></i></div>
          <div class="tab">
            <span class="favicon"></span>
            <span>Weekend in Lisbon: planner</span>
            <svg class="close" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 4l6 6M10 4l-6 6" /></svg>
          </div>
          <svg class="newtab" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10" /></svg>
        </div>

        <div class="toolbar">
          <span class="btn">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 9H3.5M8 4.5 3.5 9 8 13.5" /></svg>
          </span>
          <span class="btn dim">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h11.5M10 4.5 14.5 9 10 13.5" /></svg>
          </span>
          <span class="btn">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 9a5.5 5.5 0 1 1-1.6-3.9" /><path d="M14.5 3.5v3.2h-3.2" /></svg>
          </span>
          <div class="omnibox">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 5h6M11.5 5h2M2.5 11h2M7.5 11h6" /><circle cx="10" cy="5" r="1.6" /><circle cx="6" cy="11" r="1.6" /></svg>
            <span><span class="host">example.com</span><span class="path">/lisbon/weekend-planner</span></span>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="m8 1.8 1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z" /></svg>
          </div>
          <span class="btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 11H19V7a2 2 0 0 0-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4a2 2 0 0 0-2 2v3.8h1.5a2.7 2.7 0 0 1 0 5.4H2V20a2 2 0 0 0 2 2h3.8v-1.5a2.7 2.7 0 0 1 5.4 0V22H17a2 2 0 0 0 2-2v-4h1.5a2.5 2.5 0 0 0 0-5z" /></svg>
          </span>
          <span class="btn active"><img src="assets/icon-32.png" alt="" /></span>
          <span class="btn"><span class="avatar"></span></span>
          <span class="btn">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><circle cx="9" cy="3.8" r="1.5" /><circle cx="9" cy="9" r="1.5" /><circle cx="9" cy="14.2" r="1.5" /></svg>
          </span>
        </div>

        <div class="page">
          <div class="bar" style="width: 30%"></div>
          <div class="title"></div>
          <div class="hero"></div>
          <div class="bar" style="width: 92%"></div>
          <div class="bar" style="width: 86%"></div>
          <div class="bar" style="width: 90%"></div>
          <div class="bar" style="width: 60%"></div>
        </div>
      </div>

      <figure class="popup">
        <img src="captures/overview.png" alt="" />
      </figure>
    </div>
  </body>
</html>
