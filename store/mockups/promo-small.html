<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hissab small promo tile</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Shown as small as 220×140 in store search results, so: the mark, the
         name and one short line, nothing that needs reading up close. The
         icon carries the pastel wash itself, so the tile goes dark (the
         popup's own ground, tinted toward the icon's plum) to let it stand
         out instead of melting into a matching background. */
      body {
        color: #f6eef9;
        background:
          radial-gradient(
            60% 90% at 100% 0%,
            rgba(244, 166, 135, 0.22),
            rgba(244, 166, 135, 0) 70%
          ),
          radial-gradient(
            70% 100% at 0% 100%,
            rgba(190, 148, 244, 0.26),
            rgba(190, 148, 244, 0) 70%
          ),
          #1b1520;
      }

      .tile {
        position: absolute;
        left: 40px;
        top: 50%;
        transform: translateY(-50%);
      }

      .lockup {
        --mark: 76px;
      }

      .tile p {
        margin: 22px 0 0;
        font-family: var(--font-head);
        font-weight: 600;
        font-size: 27px;
        line-height: 1.15;
        color: var(--pink);
      }

      .lockup img {
        box-shadow: 0 10px 28px -10px rgba(198, 157, 243, 0.55);
      }
    </style>
  </head>
  <body style="--w: 440px; --h: 280px">
    <div class="tile">
      <div class="lockup">
        <img src="assets/icon.png" alt="" />
        <span>Hissab</span>
      </div>
      <p>Math the way you’d say it</p>
    </div>
  </body>
</html>
